<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Precio ahora</title>
  <meta name="description" content="Precios de gasolina, diésel y GLP en España, por provincia, con los datos oficiales del Ministerio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@24,400,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      color-scheme: light;
      --bg: #faf8ff;
      --surface: #ffffff;
      --ink: #131b2e;
      --muted: #545f73;
      --line: #bec9c3;
      --soft: #f2f3ff;
      --accent: #0f6e56;
      --accent-text: #0f6e56;
      --accent-ink: #ffffff;
      --pin: #131b2e;
      --pin-ink: #ffffff;
      --shadow: 0 -4px 16px rgba(15, 23, 42, 0.06);
      --header: 3.5rem;
      --sheet: 46vh;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #131b2e;
        --surface: #1c2638;
        --ink: #eef0ff;
        --muted: #bcc7de;
        --line: #3f4944;
        --soft: #283044;
        --accent: #0f6e56;
        --accent-text: #84d6b9;
        --accent-ink: #ffffff;
        --pin: #eef0ff;
        --pin-ink: #131b2e;
        --shadow: 0 -4px 16px rgba(0, 0, 0, 0.35);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Source Sans 3", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      color: var(--ink);
      background: var(--bg);
      overflow: hidden;
    }
    button, select, a { font: inherit; color: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .icon {
      font-family: "Material Symbols Outlined";
      font-weight: 400;
      font-style: normal;
      font-size: 20px;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
    }
    header {
      height: var(--header);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 0.5rem; min-width: 0; flex: 1; }
    .brand div { min-width: 0; }
    .brand .icon { color: var(--accent-text); }
    h1 {
      margin: 0;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.1;
      color: var(--accent-text);
    }
    #stamp {
      margin: 0.1rem 0 0;
      font-size: 11px;
      line-height: 1.2;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #refresh {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      flex-shrink: 0;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      padding: 0.35rem 0.65rem;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent-text);
      cursor: pointer;
    }
    #refresh:hover { background: var(--soft); }
    #refresh:disabled { opacity: 0.55; cursor: progress; }
    .workspace { height: calc(100% - var(--header)); position: relative; overflow: hidden; }
    #map { position: absolute; inset: 0 0 var(--sheet) 0; background: var(--soft); }
    .sheet {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: var(--sheet);
      z-index: 500;
      background: var(--surface);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }
    .controls { padding: 0.75rem 1rem 0.5rem; border-bottom: 1px solid var(--line); }
    .place {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.35rem 0.6rem;
      margin-bottom: 0.6rem;
    }
    .place .icon { color: var(--muted); font-size: 18px; }
    #provincia {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .fuels { display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem; background: var(--soft); border-radius: 4px; padding: 0.2rem; }
    .fuels button {
      min-width: 0;
      border: 0;
      background: transparent;
      border-radius: 4px;
      padding: 0.4rem 0.45rem;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      color: var(--muted);
    }
    .fuels button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
    .meta {
      display: flex;
      align-items: center;
      padding: 0.55rem 1rem 0.4rem;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.25rem;
      margin: 0 1rem 0.45rem;
      background: var(--soft);
      border-radius: 4px;
      padding: 0.2rem;
    }
    .modes button {
      border: 0;
      background: transparent;
      border-radius: 4px;
      padding: 0.4rem 0.45rem;
      cursor: pointer;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
    }
    .modes button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
    .from {
      margin: 0 1rem 0.4rem;
      font-size: 13px;
      color: var(--muted);
    }
    .from[hidden] { display: none; }
    .route {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin: 0 1rem 0.45rem;
      padding: 0.45rem 0.6rem;
      background: var(--accent);
      color: #fff;
      border-radius: 4px;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-weight: 600;
    }
    .route[hidden] { display: none; }
    .route button {
      border: 0;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
    }
    #lista {
      list-style: none;
      margin: 0;
      padding: 0 0.5rem 0.5rem;
      overflow: auto;
      flex: 1;
      min-height: 0;
    }
    .item {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }
    .item.cheap { background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .row {
      flex: 1;
      min-width: 0;
      display: grid;
      grid-template-columns: 2rem minmax(0, 1fr) auto;
      gap: 0.55rem;
      align-items: center;
      padding: 0.65rem 0.5rem;
      border: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .mark {
      width: 2rem;
      height: 2rem;
      border-radius: 4px;
      display: grid;
      place-items: center;
      background: var(--soft);
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-weight: 700;
    }
    .item.cheap .mark { background: var(--accent); color: var(--accent-ink); }
    .who { min-width: 0; overflow: hidden; }
    .who strong {
      display: block;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .who span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .who .badge { color: var(--accent-text); font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    .euros {
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .euros small { font-size: 0.7rem; font-weight: 600; margin-left: 0.1rem; }
    .ruta {
      flex-shrink: 0;
      margin-right: 0.5rem;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.35rem 0.5rem;
    }
    .ruta:hover { border-color: var(--accent-text); color: var(--accent-text); }
    .note {
      margin: 0;
      padding: 0.55rem 1rem 0.75rem;
      font-size: 12px;
      color: var(--muted);
    }
    .empty { padding: 1rem; color: var(--muted); }
    #locate {
      position: absolute;
      z-index: 1000;
      top: 0.75rem;
      right: 0.75rem;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 8px;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }
    .leaflet-marker-icon.pin { background: none; border: none; }
    .pin-body {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      background: var(--pin);
      color: var(--pin-ink);
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-weight: 700;
      font-size: 13px;
      line-height: 1.2;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.25);
    }
    .pin-body.cheap { background: var(--accent); color: #fff; }
    .pin-body small { font-size: 9px; letter-spacing: 0.04em; font-weight: 600; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--ink); }
    .leaflet-popup-content .ruta { display: inline-block; margin-top: 0.45rem; }
    .leaflet-bar a { background: var(--surface); color: var(--ink); border-color: var(--line); }
    .leaflet-container { font-family: "Source Sans 3", system-ui, sans-serif; }
    .leaflet-control-attribution { font-size: 10px; max-width: calc(100% - 8px); }
    @media (prefers-color-scheme: dark) {
      .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.92) saturate(0.25); }
    }
    @media (min-width: 768px) {
      .fuels { grid-template-columns: repeat(4, 1fr); }
      #map { inset: 0 0 0 380px; }
      .sheet {
        top: 0; bottom: 0; right: auto;
        width: 380px;
        height: auto;
        box-shadow: none;
        border-right: 1px solid var(--line);
      }
    }
    @media (min-width: 1280px) {
      #map { inset: 0 0 0 420px; }
      .sheet { width: 420px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="icon" aria-hidden="true">local_gas_station</span>
      <div>
        <h1>Precio ahora</h1>
        <p id="stamp">Datos del Ministerio</p>
      </div>
    </div>
    <button type="button" id="refresh"><span class="icon" aria-hidden="true">refresh</span> Actualizar</button>
  </header>
  <div class="workspace">
    <div id="map" role="region" aria-label="Mapa de estaciones"></div>
    <button type="button" id="locate"><span class="icon" aria-hidden="true">my_location</span> Cerca de mí</button>
    <section class="sheet" aria-label="Estaciones">
      <div class="controls">
        <div class="place">
          <span class="icon" aria-hidden="true">location_on</span>
          <label class="sr-only" for="provincia" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Provincia</label>
          <select id="provincia"></select>
        </div>
        <div class="fuels" role="radiogroup" aria-label="Carburante">
          <button type="button" role="radio" data-fuel="g95" aria-checked="true">Gasolina 95</button>
          <button type="button" role="radio" data-fuel="g98" aria-checked="false">Gasolina 98</button>
          <button type="button" role="radio" data-fuel="goa" aria-checked="false">Diésel</button>
          <button type="button" role="radio" data-fuel="glp" aria-checked="false">GLP</button>
        </div>
      </div>
      <div class="meta">
        <span id="count">Leyendo precios</span>
      </div>
      <div class="modes" role="radiogroup" aria-label="Orden">
        <button type="button" role="radio" data-sort="precio" aria-checked="true">Por precio</button>
        <button type="button" role="radio" data-sort="dist" aria-checked="false">Por distancia</button>
      </div>
      <p id="from" class="from" hidden></p>
      <p id="route" class="route" hidden>
        <span id="route-text"></span>
        <button type="button" id="route-clear">Quitar</button>
      </p>
      <ul id="lista"></ul>
      <p class="note" id="note">Los precios se actualizan cada media hora. La recarga eléctrica no publica el €/kWh.</p>
    </section>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API = "https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes";
    const FUELS = {
      g95: ["Precio Gasolina 95 E5", "Precio Gasolina 95 E10"],
      g98: ["Precio Gasolina 98 E5", "Precio Gasolina 98 E10"],
      goa: ["Precio Gasoleo A"],
      glp: ["Precio Gases licuados del petróleo"]
    };
    const CENTER = {
      1:[42.85,-2.67],2:[38.99,-1.86],3:[38.35,-0.49],4:[36.84,-2.46],5:[40.66,-4.70],
      6:[38.88,-6.97],7:[39.57,2.65],8:[41.39,2.17],9:[42.34,-3.70],10:[39.47,-6.37],
      11:[36.53,-6.29],12:[40.00,-0.04],13:[38.99,-3.93],14:[37.88,-4.78],15:[43.37,-8.41],
      16:[40.07,-2.14],17:[41.98,2.82],18:[37.18,-3.60],19:[40.63,-3.16],20:[43.10,-2.17],
      21:[37.26,-6.95],22:[42.14,-0.41],23:[37.77,-3.79],24:[42.60,-5.57],25:[41.62,0.62],
      26:[42.29,-2.45],27:[43.01,-7.56],28:[40.42,-3.70],29:[36.72,-4.42],30:[37.99,-1.13],
      31:[42.70,-1.65],32:[42.34,-7.86],33:[43.36,-5.85],34:[42.01,-4.53],35:[28.12,-15.43],
      36:[42.43,-8.64],37:[40.97,-5.66],38:[28.46,-16.25],39:[43.18,-4.05],40:[40.95,-4.12],
      41:[37.39,-5.98],42:[41.77,-2.47],43:[41.12,1.25],44:[40.35,-1.11],45:[39.86,-4.02],
      46:[39.47,-0.38],47:[41.65,-4.72],48:[43.26,-2.93],49:[41.50,-5.75],50:[41.65,-0.88],
      51:[35.89,-5.32],52:[35.29,-2.94]
    };

    const $ = (id) => document.getElementById(id);
    const provincia = $("provincia");
    const lista = $("lista");
    const count = $("count");
    const stamp = $("stamp");
    let rows = [];
    let here = null;
    let hereMark = null;
    let centerMark = null;
    let sortBy = "precio";
    let fuel = "g95";
    let ctrl = null;
    let fitted = false;
    let moveT = 0;

    const map = L.map("map", { zoomControl: true }).setView([40.2, -3.7], 6);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);
    const pins = L.layerGroup().addTo(map);
    let routeLine = null;
    const markers = new Map();
    let openId = null;

    function num(v) {
      if (v == null || v === "") return null;
      const n = parseFloat(String(v).replace(",", "."));
      return Number.isFinite(n) ? n : null;
    }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function fmt(n) { return n.toFixed(3).replace(".", ","); }
    function fmtKm(km) {
      const t = km < 10 ? km.toFixed(1) : String(Math.round(km));
      return t.replace(".", ",") + " km";
    }
    function titleCase(s) {
      return s.toLocaleLowerCase("es").replace(/(^|[\s/(])(\p{L})/gu, (_, a, b) => a + b.toLocaleUpperCase("es"));
    }
    function km(a, b) {
      const R = 6371;
      const dLat = (b.lat - a.lat) * Math.PI / 180;
      const dLng = (b.lng - a.lng) * Math.PI / 180;
      const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
    }
    function priceOf(row) {
      for (const key of FUELS[fuel]) {
        const n = num(row[key]);
        if (n > 0) return n;
      }
      return null;
    }
    function stations() {
      const out = [];
      for (const row of rows) {
        const lat = num(row.Latitud);
        const lng = num(row["Longitud (WGS84)"]);
        const price = priceOf(row);
        if (lat == null || lng == null || price == null) continue;
        if (lat < 27 || lat > 44.6 || lng < -19 || lng > 5) continue;
        const item = {
          id: String(row.IDEESS),
          name: row["Rótulo"] || "Estación",
          addr: [row["Dirección"], row.Municipio].filter(Boolean).join(", "),
          hours: row.Horario || "",
          lat, lng, price
        };
        const origin = sortBy === "dist" ? (here || mapCenter()) : null;
        if (origin) item.dist = km(origin, item);
        out.push(item);
      }
      out.sort((a, b) => sortBy === "dist" && a.dist != null
        ? a.dist - b.dist
        : a.price - b.price || a.name.localeCompare(b.name, "es"));
      return out;
    }
    function pinIcon(item, cheap) {
      const html = cheap
        ? `<span class="pin-body cheap"><small>Más barata</small>${fmt(item.price)}</span>`
        : `<span class="pin-body">${fmt(item.price)}</span>`;
      return L.divIcon({
        className: "pin",
        html,
        iconSize: cheap ? [78, 40] : [58, 24],
        iconAnchor: cheap ? [39, 40] : [29, 24]
      });
    }
    function popupHtml(s) {
      const dist = s.dist != null ? `<br>${fmtKm(s.dist)}` : "";
      return `<strong>${esc(s.name)}</strong><br>${esc(s.addr)}${dist}<br><b>${fmt(s.price)} €/L</b><br><a class="ruta" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}" target="_blank" rel="noopener">Ruta</a>`;
    }
    function mapCenter() {
      if (!fitted) return null;
      const c = map.getCenter();
      return { lat: c.lat, lng: c.lng };
    }
    function syncCenter() {
      const show = sortBy === "dist" && !here && fitted;
      if (!show) {
        if (centerMark) { map.removeLayer(centerMark); centerMark = null; }
        return;
      }
      const c = map.getCenter();
      if (!centerMark) {
        centerMark = L.circleMarker(c, { radius: 8, color: "#0f6e56", weight: 2, fillColor: "#ffffff", fillOpacity: 1 }).addTo(map);
      } else {
        centerMark.setLatLng(c);
      }
      centerMark.bringToFront();
    }
    function inView(list) {
      if (!fitted) return list;
      const bounds = map.getBounds();
      return list.filter((s) => bounds.contains([s.lat, s.lng]));
    }
    function drawPins(list) {
      const keep = openId;
      pins.clearLayers();
      markers.clear();
      const min = list.length ? Math.min(...list.map((s) => s.price)) : null;
      for (const s of list) {
        const marker = L.marker([s.lat, s.lng], { icon: pinIcon(s, s.price === min) });
        marker.bindPopup(popupHtml(s));
        marker.on("popupclose", () => { if (openId === s.id) openId = null; });
        marker.addTo(pins);
        markers.set(s.id, marker);
      }
      if (keep && markers.has(keep)) {
        openId = keep;
        markers.get(keep).openPopup();
      }
    }
    function render() {
      const all = stations();
      const view = inView(all);
      const list = view.slice(0, 40);
      const min = list.length ? Math.min(...list.map((s) => s.price)) : null;
      const fuelName = document.querySelector('.fuels button[aria-checked="true"]').textContent;
      for (const b of document.querySelectorAll(".modes button")) b.setAttribute("aria-checked", String(b.dataset.sort === sortBy));
      count.textContent = view.length
        ? `${view.length} en el mapa · ${fuelName}`
        : `Sin precio de ${fuelName}`;
      $("from").hidden = sortBy !== "dist";
      $("from").textContent = here
        ? "Distancias desde donde estás"
        : "Distancias desde el centro del mapa";
      if (!all.length) {
        lista.innerHTML = `<li class="empty">Ninguna estación informa este carburante en la provincia.</li>`;
      } else if (!view.length) {
        lista.innerHTML = `<li class="empty">Ninguna en esta zona del mapa.</li>`;
      } else {
        lista.innerHTML = list.map((s) => {
          const cheap = s.price === min;
          const extra = cheap ? `<span class="badge">Más económica</span>` : "";
          const dist = s.dist != null ? ` · ${fmtKm(s.dist)}` : "";
          const hours = s.hours ? ` · ${esc(s.hours)}` : "";
          return `<li class="item${cheap ? " cheap" : ""}">
            <button type="button" class="row" data-id="${esc(s.id)}">
              <span class="mark" aria-hidden="true">${esc(s.name.trim().charAt(0) || "·")}</span>
              <span class="who"><strong>${esc(s.name)}</strong>${extra}<span>${esc(s.addr)}${dist}${hours}</span></span>
              <span class="euros">${fmt(s.price)}<small>€/L</small></span>
            </button>
            <a class="ruta" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}" target="_blank" rel="noopener">Ruta</a>
          </li>`;
        }).join("");
      }
      drawPins(list);
      syncCenter();
      if (!fitted && all.length) {
        fitted = true;
        map.fitBounds(L.latLngBounds(all.map((s) => [s.lat, s.lng])), { padding: [28, 28], maxZoom: 12 });
      }
      document.documentElement.dataset.ready = list.length ? "1" : "0";
    }
    let loadedIds = [];
    function sameIds(a, b) {
      return a.length === b.length && a.slice().sort().join() === b.slice().sort().join();
    }
    function provincesForView() {
      if (!fitted || !provincia.options.length) return [];
      const center = map.getCenter();
      const bounds = map.getBounds().pad(0.6);
      const ranked = [];
      for (const opt of provincia.options) {
        const c = CENTER[parseInt(opt.value, 10)];
        if (!c) continue;
        const ll = L.latLng(c[0], c[1]);
        ranked.push({ id: opt.value, d: center.distanceTo(ll), inside: bounds.contains(ll) });
      }
      ranked.sort((a, b) => a.d - b.d);
      const inside = ranked.filter((p) => p.inside).slice(0, 3);
      return (inside.length ? inside : ranked.slice(0, 1)).map((p) => p.id);
    }
    async function load(ids, keepView) {
      const list = (Array.isArray(ids) ? ids : [ids]).filter(Boolean).slice(0, 3);
      if (!list.length) return;
      ctrl?.abort();
      ctrl = new AbortController();
      const signal = ctrl.signal;
      $("refresh").disabled = true;
      count.textContent = "Leyendo precios";
      if (!keepView) {
        fitted = false;
        clearRoute();
      }
      try {
        const parts = await Promise.all(list.map(async (id) => {
          const res = await fetch(`${API}/EstacionesTerrestres/FiltroProvincia/${encodeURIComponent(id)}`, {
            headers: { Accept: "application/json" },
            signal
          });
          if (!res.ok) throw new Error(String(res.status));
          return res.json();
        }));
        rows = parts.flatMap((d) => d.ListaEESSPrecio || []);
        const fecha = parts.map((d) => d.Fecha).find(Boolean);
        stamp.textContent = fecha ? `Datos del Ministerio · ${fecha}` : "Datos del Ministerio";
        loadedIds = list.slice();
        if (keepView) {
          const centerId = nearestId(map.getCenter().lat, map.getCenter().lng);
          if (centerId) provincia.value = centerId;
        }
        try { localStorage.setItem("precio-prov", provincia.value); } catch (e) {}
        render();
      } catch (err) {
        if (err.name === "AbortError") return;
        rows = [];
        loadedIds = [];
        lista.innerHTML = `<li class="empty">No se han podido leer los precios del Ministerio. Prueba a actualizar.</li>`;
        count.textContent = "Sin datos";
        document.documentElement.dataset.ready = "err";
      } finally {
        $("refresh").disabled = false;
      }
    }
    function nearestId(lat, lng) {
      let best = null;
      let bestD = Infinity;
      for (const opt of provincia.options) {
        const c = CENTER[parseInt(opt.value, 10)];
        if (!c) continue;
        const d = (c[0] - lat) ** 2 + (c[1] - lng) ** 2;
        if (d < bestD) { bestD = d; best = opt.value; }
      }
      return best;
    }
    function clearRoute() {
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      $("route").hidden = true;
    }
    function askHere() {
      if (here) return Promise.resolve(here);
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) { reject(new Error("no")); return; }
        navigator.geolocation.getCurrentPosition((pos) => {
          here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          if (hereMark) map.removeLayer(hereMark);
          hereMark = L.circleMarker([here.lat, here.lng], { radius: 7, color: "#0f6e56", fillColor: "#84d6b9", fillOpacity: 1, weight: 2 }).addTo(map);
          resolve(here);
        }, () => reject(new Error("denied")));
      });
    }
    async function routeTo(dest) {
      count.textContent = "Calculando ruta";
      try {
        const origin = await askHere();
        const url = `https://router.project-osrm.org/route/v1/driving/${origin.lng},${origin.lat};${dest.lng},${dest.lat}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();
        const path = data.routes && data.routes[0];
        if (!res.ok || !path) throw new Error("no");
        if (routeLine) map.removeLayer(routeLine);
        routeLine = L.geoJSON(path.geometry, { style: { color: "#0f6e56", weight: 5, opacity: 0.95 } }).addTo(map);
        fitted = true;
        map.fitBounds(routeLine.getBounds(), { padding: [36, 36] });
        const minutes = Math.max(1, Math.round(path.duration / 60));
        $("route-text").textContent = `${minutes} min · ${fmtKm(path.distance / 1000)} en coche`;
        $("route").hidden = false;
      } catch (err) {
        if (err.message === "denied" || err.message === "no") {
          count.textContent = "Sin permiso de ubicación";
          return;
        }
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${dest.lat},${dest.lng}`, "_blank", "noopener");
      }
    }
    function locate() {
      if (!navigator.geolocation) {
        count.textContent = "Este navegador no da la ubicación";
        return;
      }
      count.textContent = "Buscando tu ubicación";
      navigator.geolocation.getCurrentPosition((pos) => {
        here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        if (hereMark) map.removeLayer(hereMark);
        hereMark = L.circleMarker([here.lat, here.lng], { radius: 7, color: "#0f6e56", fillColor: "#84d6b9", fillOpacity: 1, weight: 2 }).addTo(map);
        sortBy = "dist";
        for (const b of document.querySelectorAll(".modes button")) b.setAttribute("aria-checked", String(b.dataset.sort === "dist"));
        const id = nearestId(here.lat, here.lng);
        if (id && id !== provincia.value) {
          provincia.value = id;
          load(id).then(() => map.setView([here.lat, here.lng], 13));
        } else {
          fitted = true;
          render();
          map.setView([here.lat, here.lng], 13);
        }
      }, () => { count.textContent = "Sin permiso de ubicación"; });
    }

    provincia.addEventListener("change", () => load([provincia.value]));
    $("refresh").addEventListener("click", () => load(loadedIds.length ? loadedIds : [provincia.value], true));
    $("locate").addEventListener("click", locate);
    $("route-clear").addEventListener("click", clearRoute);
    function onRouteClick(ev) {
      const link = ev.target.closest("a.ruta");
      if (!link) return;
      ev.preventDefault();
      const dest = new URL(link.href).searchParams.get("destination");
      if (!dest) return;
      const [lat, lng] = dest.split(",").map(Number);
      routeTo({ lat, lng });
    }
    document.addEventListener("click", onRouteClick);
    map.on("popupopen", (ev) => {
      const link = ev.popup.getElement().querySelector("a.ruta");
      if (!link || link.dataset.bound) return;
      link.dataset.bound = "1";
      link.addEventListener("click", onRouteClick);
    });
    document.querySelector(".modes").addEventListener("click", (ev) => {
      const btn = ev.target.closest("button");
      if (!btn) return;
      sortBy = btn.dataset.sort;
      render();
    });
    document.querySelector(".fuels").addEventListener("click", (ev) => {
      const btn = ev.target.closest("button");
      if (!btn) return;
      fuel = btn.dataset.fuel;
      try { localStorage.setItem("precio-fuel", fuel); } catch (e) {}
      for (const b of document.querySelectorAll(".fuels button")) b.setAttribute("aria-checked", String(b === btn));
      render();
    });
    lista.addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-id]");
      if (!btn) return;
      const s = stations().find((item) => item.id === btn.dataset.id);
      if (!s) return;
      openId = s.id;
      fitted = true;
      map.setView([s.lat, s.lng], Math.max(map.getZoom(), 14));
      render();
    });
    map.on("moveend", () => {
      clearTimeout(moveT);
      moveT = setTimeout(() => {
        if (!fitted) return;
        const ids = provincesForView();
        if (ids.length && !sameIds(ids, loadedIds)) load(ids, true);
        else if (rows.length) render();
      }, 200);
    });

    (async function init() {
      const res = await fetch(`${API}/Listados/Provincias/`, { headers: { Accept: "application/json" } });
      const data = await res.json();
      const items = data.slice().sort((a, b) => a.Provincia.localeCompare(b.Provincia, "es"));
      provincia.innerHTML = items.map((p) => `<option value="${esc(p.IDPovincia)}">${esc(titleCase(p.Provincia))}</option>`).join("");
      let saved = "28";
      let savedFuel = "g95";
      try {
        saved = localStorage.getItem("precio-prov") || "28";
        savedFuel = localStorage.getItem("precio-fuel") || "g95";
      } catch (e) {}
      if (FUELS[savedFuel]) {
        fuel = savedFuel;
        for (const b of document.querySelectorAll(".fuels button")) b.setAttribute("aria-checked", String(b.dataset.fuel === fuel));
      }
      if (![...provincia.options].some((o) => o.value === saved)) saved = "28";
      provincia.value = saved;
      map.invalidateSize();
      load(saved);
    })().catch(() => {
      lista.innerHTML = `<li class="empty">No se han podido leer las provincias del Ministerio.</li>`;
    });
  </script>
</body>
</html>
